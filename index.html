
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

.calculadora {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 20px;
    width: 300px;
}

#display {
    width: 100%;
    height: 70px;
    background: #292929;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 30px;
    text-align: right;
    padding: 10px;
    margin-bottom: 15px;
}

.botoes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 55px;
    border: none;
    border-radius: 12px;
    background: #333;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

button:hover {
    background: #444;
}

.operador {
    background: #7138a8;
}

.operador:hover {
    background: #8548bd;
}

.igual {
    background: #9b5de5;
    grid-column: span 2;
}

.limpar {
    background: #a83232;
}
</style>
</head>

<body>

<div class="calculadora">
    <input type="text" id="display" value="0" readonly>

    <div class="botoes">
        <button class="limpar" onclick="limpar()">C</button>
        <button onclick="apagar()">⌫</button>
        <button class="operador" onclick="adicionar('/')">÷</button>
        <button class="operador" onclick="adicionar('*')">×</button>

        <button onclick="adicionar('7')">7</button>
        <button onclick="adicionar('8')">8</button>
        <button onclick="adicionar('9')">9</button>
        <button class="operador" onclick="adicionar('-')">−</button>

        <button onclick="adicionar('4')">4</button>
        <button onclick="adicionar('5')">5</button>
        <button onclick="adicionar('6')">6</button>
        <button class="operador" onclick="adicionar('+')">+</button>

        <button onclick="adicionar('1')">1</button>
        <button onclick="adicionar('2')">2</button>
        <button onclick="adicionar('3')">3</button>
        <button onclick="adicionar('.')">.</button>

        <button onclick="adicionar('0')">0</button>
        <button class="igual" onclick="calcular()">=</button>
    </div>
</div>

<script>
const display = document.getElementById("display");

function adicionar(valor) {
    if (display.value === "0") {
        display.value = valor;
    } else {
        display.value += valor;
    }
}

function limpar() {
    display.value = "0";
}

function apagar() {
    display.value = display.value.slice(0, -1) || "0";
}

function calcular() {
    try {
        if (!/^[0-9+\-*/. ()]+$/.test(display.value)) {
            throw new Error();
        }
        display.value = Function('"use strict"; return (' + display.value + ')')();
        if (!Number.isFinite(Number(display.value))) {
            throw new Error();
        }
    } catch {
        display.value = "Erro";
    }
}
</script>

</body>
</html>
